name: Verify and publish Particle Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: particle-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zhudaandzhuer/zhuda-laya-engine
          ref: 0ab067faff34ed2db47ec6e181b3e7931df68189
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the pinned public engine SDK
        working-directory: .engine
        run: npm install && npm run build
      - name: Build standalone Particle Lab
        env:
          ZHUDA_ENGINE_ROOT: ${{ github.workspace }}/.engine
        run: npm run build
      - name: Verify all 100 effects and original regressions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify > verification.log 2>&1
      - name: Verify video homepage and repository subpath links
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:publication >> verification.log 2>&1
      - name: Verify engine capabilities workbench
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:capabilities >> verification.log 2>&1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            verification.log
            evidence/*.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified demo
        id: deployment
        uses: actions/deploy-pages@v4
