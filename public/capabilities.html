<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>進階特效工作台 · Zhuda Particle Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b121a;color:#dbe7e8;font:14px system-ui}header{max-width:1300px;margin:auto;padding:24px;border-bottom:1px solid #2c4148;display:flex;gap:24px;align-items:center}a{color:#a5efd0}h1{font-size:20px;margin:0}main{max-width:1300px;margin:auto;padding:24px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px}aside{display:flex;flex-direction:column;gap:9px}button,select{background:#152731;border:1px solid #38505a;color:#dbe7e8;padding:12px;border-radius:4px;text-align:left;font:inherit;cursor:pointer}button.active{border-color:#a5efd0;color:#a5efd0}iframe{width:100%;aspect-ratio:960/660;border:1px solid #38505a;border-radius:5px;background:#0b121a}h2{font-size:20px;font-weight:500}p{color:#9bb1bb;line-height:1.8}input{width:100%;accent-color:#a5efd0}pre{white-space:pre-wrap;color:#a5efd0;font-size:12px;line-height:1.8}section{min-width:0}.tools{display:flex;gap:12px;margin:16px 0}.tools button{flex:1;text-align:center}small{color:#8ca8b0}textarea{width:100%;height:200px;background:#101f28;color:#bcdbd3;border:1px solid #38505a;padding:12px;font:11px monospace}@media(max-width:800px){main{grid-template-columns:1fr;padding:16px}aside{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}aside button{font-size:11px;padding:10px}header{padding:18px;flex-wrap:wrap}}
</style></head><body><header><h1>進階特效工作台</h1><a href="./">100 種效果</a><a href="showcase.html">展示首頁</a><small>獨立製作工具 · 使用引擎公開 SDK</small></header><main><aside id="modes"></aside><section><iframe id="stage" src="capability-stage.html" title="即時 WebGL 特效"></iframe><h2 id="title">載入中</h2><p id="description"></p><label>效果強度 <output id="value">0.4</output><input id="strength" type="range" min="0" max="1" step="0.01" value="0.4"></label><div class="tools"><button id="replay">重播</button><button id="pause">暫停／繼續</button><button id="export">匯出設定 JSON</button></div><pre id="stats"></pre><details><summary>檢視目前效果設定</summary><textarea id="json" readonly></textarea></details><details open id="emitter-editor"><summary>編輯主發射器</summary><p>調整 JSON 中的粒子、圖集或材質參數，再套用。工作台提供 white、noise、mask、checker、atlas、glow 六種測試貼圖。</p><textarea id="emitter"></textarea><button id="apply-emitter">套用發射器</button></details><details id="timeline-editor"><summary>編輯演出時間軸</summary><p>fx 為發射器，rig.hand 為示範掛點；可編輯 intensity 曲線與啟停事件。</p><svg id="curve" viewBox="0 0 400 100" width="100%" height="100" aria-label="發射強度曲線"></svg><textarea id="timeline-json"></textarea><button id="apply-timeline">套用時間軸</button></details><p id="message"></p></section></main><script>
const modes=[['dissolve','溶解與邊緣發光','噪聲控制溶解邊界，遮罩裁切外形。拖動強度查看完整到消失。'],['distortion','熱浪與背景折射','讀取相機不透明畫面，依噪聲偏移取樣，背景棋盤會真正扭曲。'],['soft','柔化深度交界','讀取場景深度，柔化粒子與前方方塊的交界。拖到零可比較硬切邊。'],['bloom','高亮泛光','使用 Laya 後處理，讓高亮區域向周圍擴散。'],['flipbook','序列幀與圖集','單張 4×4 圖集每秒切換 12 幀，保留獨立粒子的生命時間。'],['collision','雨滴碰撞與濺水','雨滴碰地後消失，碰撞事件在落點生成六顆濺水粒子。'],['timeline','掛點與演出時間軸','移動掛點控制發射器位置，時間軸調整發射強度及啟停。'],['budget','多效果整體預算','八個發射器共用總粒子預算，按優先度分配。降低預算後，存活粒子自然消散。'],['pbr','Unity PBR 材質轉換','同一來源色彩轉為真正的 PBR 材質，依序增加金屬度與光滑度。']];
let current='dissolve';const $=id=>document.getElementById(id);function select(id){current=id;window.capabilities?.setMode(id);for(const b of document.querySelectorAll('[data-mode]'))b.classList.toggle('active',b.dataset.mode===id);const m=modes.find(m=>m[0]===id);$('title').textContent=m[1];$('description').textContent=m[2];$('strength').value=window.capabilities?.value??.4;$('value').textContent=$('strength').value;$('strength').disabled=!['dissolve','distortion','soft','budget'].includes(id);}
for(const [id,title]of modes){const b=document.createElement('button');b.dataset.mode=id;b.textContent=title;b.onclick=()=>select(id);$('modes').append(b);}select(current);
$('apply-emitter').onclick=()=>{try{capabilities.configureEmitter(JSON.parse($('emitter').value));$('message').textContent='設定驗證通過，已套用。';}catch(e){$('message').textContent='設定未套用：'+e.message;}};
$('apply-timeline').onclick=()=>{try{capabilities.configureTimeline(JSON.parse($('timeline-json').value));$('message').textContent='時間軸已套用。';}catch(e){$('message').textContent='時間軸未套用：'+e.message;}};
function curve(){try{const s=JSON.parse($('timeline-json').value),keys=s.tracks?.[0]?.keys||[];const points=keys.map(k=>`${k.time/s.duration*390+5},${95-k.value*70}`).join(' ');$('curve').innerHTML='<path d="M5 5V95H395" fill="none" stroke="#38505a"/><polyline fill="none" stroke="#a5efd0" stroke-width="2" points="'+points+'"/>';}catch{}}
$('timeline-json').oninput=curve;
$('strength').oninput=()=>{$('value').textContent=$('strength').value;capabilities?.setValue(Number($('strength').value));};$('replay').onclick=()=>{capabilities?.setMode(current);if(capabilities)capabilities.paused=false;};$('pause').onclick=()=>{if(capabilities)capabilities.paused=!capabilities.paused;};$('export').onclick=()=>{const text=capabilities.exportJSON();const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=current+'.effect.json';a.click();URL.revokeObjectURL(url);};
setInterval(()=>{window.capabilities=$('stage').contentWindow.capabilities;if(!capabilities)return;const s=capabilities.stats();$('stats').textContent=`${s.particles} 活躍粒子 · ${s.events} 次碰撞\n實測幀間隔 P95：${s.profiler.frameP95Ms?.toFixed(1)||'—'} ms · GPU 時間：未量測`;const data=JSON.parse(capabilities.exportJSON());$('json').value=JSON.stringify(data,null,2);if(document.activeElement!==$('emitter')&&$('emitter').dataset.mode!==data.mode){$('emitter').value=JSON.stringify(data.effects[0]||{},null,2);$('emitter').dataset.mode=data.mode;}$('emitter-editor').hidden=!data.effects.length;$('timeline-editor').hidden=data.mode!=='timeline';if(data.timeline&&$('timeline-json').dataset.mode!==data.mode){$('timeline-json').value=JSON.stringify(data.timeline,null,2);$('timeline-json').dataset.mode=data.mode;curve();}if(data.mode!=='timeline')$('timeline-json').dataset.mode='';},250);
</script></body></html>
